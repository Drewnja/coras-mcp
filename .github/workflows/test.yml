name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          # 3.8 is not built for the arm64 macOS runners.
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the Java bridge
        if: runner.os != 'Windows'
        run: bash java/build.sh

      # The editor builds an AWT drag-and-drop target while loading a diagram,
      # so the round trip through it needs a display even off-screen.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/test_coras_mcp.py

      - name: Run the tests
        if: runner.os != 'Linux'
        run: python tests/test_coras_mcp.py

  npx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack and install the way a user would
        run: |
          npm pack
          npm install -g ./coras-mcp-*.tgz
      - name: The server answers an MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | coras-mcp | tee /dev/stderr | grep -q '"serverInfo"'
